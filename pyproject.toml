[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="community-ai-backend"
version="1.0.0"
description="Production-oriented FastAPI foundation for AI backends"
requires-python=">=3.11"
dependencies=[
 "fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","pydantic-settings>=2.4,<3",
 "sqlalchemy[asyncio]>=2.0.32,<3","asyncpg>=0.29,<1","redis>=5,<7","httpx>=0.27,<1","structlog>=24.2,<26",
 "prometheus-client>=0.20,<1","alembic>=1.13,<2"
]

[project.optional-dependencies]
dev=["pytest>=8,<10","pytest-asyncio>=0.23,<2","ruff>=0.6,<1","coverage>=7,<8"]

[tool.setuptools.packages.find]
where=["."]
include=["app*"]
exclude=["alembic*","tests*"]

[tool.pytest.ini_options]
asyncio_mode="auto"
pythonpath=["."]

[tool.ruff]
line-length=100
exclude=["alembic/versions"]

[tool.ruff.lint]
select=["E9","F63","F7","F82"]
